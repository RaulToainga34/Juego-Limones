<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Caza Estrellas</title>
  <link rel="stylesheet" href="limones.css"/>
  <img src="logo.png" class="logo40k">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <script src="utiles.js"></script>
</head>

<body onload="iniciar()">

  <div class="contenedor">

    <header class="header">
      <h1>☠️ Atrapar Limones 40K</h1>
      <p class="subtitulo">"En el oscuro futuro... solo hay limones"</p>
      <h2 class="autor">Autor: Raul Toainga</h2>
    </header>

    <section class="juego">
      <canvas id="areaJuego" width="600" height="400"></canvas>
    </section>

    <section class="panel">
      <div class="card">
        <p>Puntaje</p>
        <span id="txtPuntaje">0</span>
      </div>

      <div class="card">
        <p>Vidas</p>
        <span id="txtVidas">3</span>
      </div>
    </section>

    <section class="botones">
      <button onclick="moverIzquierda()"><span>Izquierda</span></button>
      <button onclick="moverDerecha()"><span>Derecha</span></button>
      <button onclick="bajarLimon()"><span>Bajar</span></button>
      <button class="reset" onclick="reiniciar()"><span>Reiniciar</span></button>
    </section>

  </div>

  <script src="limones.js"></script>
</body>
</html>
